<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="data:,">
    <title>绑扎定型 · 可视化编辑器</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; background:#12100c; color:#f2ead9;
            font-family:"Noto Serif SC","Songti SC","STSong",serif; touch-action:none; user-select:none; }
        #stage { position:fixed; inset:0; overflow:hidden; }
        .fill { width:100%; height:100%; object-fit:cover; display:block; }

        /* 所有 PNG 组件：位置/大小由 JS 按 CONFIG.components 写入 */
        .comp { position:absolute; pointer-events:none; object-fit:contain; }
        .comp.bg, .comp.prompt-move { object-fit:cover; }
        #prompt-start { outline:1px dashed rgba(255,180,120,0.75); }
        #flower { outline:1px dashed rgba(127,157,139,0.8); }
        #bottom-jing, #bottom-shi, #bottom-rao { outline:1px dashed rgba(120,180,220,0.6); }
        #slide-icon { outline:1px dashed rgba(230,200,134,0.75); }

        /* 主玩区：与游戏一致，居中显示 16:9 设计稿 */
        #play-stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
            padding: max(1.2%, env(safe-area-inset-top,0)) max(1.2%, env(safe-area-inset-right,0))
                     max(1.2%, env(safe-area-inset-bottom,0)) max(1.2%, env(safe-area-inset-left,0));
            z-index:4; }
        #play { aspect-ratio:16/9; width:100%; max-width:calc(100vh * 16 / 9); height:auto; max-height:100vh;
            position:relative; }

        /* 瓷杯盒 / 面板盒：位置由 JS 写入 */
        #cup-box { position:absolute; touch-action:none; outline:1px dashed rgba(90,127,191,0.65); }
        #cup-box .fill,#cup { width:100%; height:100%; object-fit:fill; display:block; }
        #panel-box { position:absolute; outline:1px dashed rgba(196,63,191,0.6); }

        /* 起终点预览：全部 5 条路径的起点/终点图标（尺寸由滑块控制） */
        #endpoints { position:absolute; inset:0; pointer-events:none; z-index:7; }
        .endpoint { position:absolute; aspect-ratio:1/1; background-size:contain;
            background-repeat:no-repeat; background-position:center;
            transform:translate(-50%,-50%); opacity:0.75; }
        .endpoint.start { filter:drop-shadow(0 0 1.2% rgba(244,168,194,0.8)); }
        .endpoint.end { filter:drop-shadow(0 0 1.8% rgba(230,200,134,0.95)); }

        #cup-svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; z-index:5; pointer-events:none; }
        .tip-path { fill:none; stroke:#f4a8c2; stroke-opacity:0.7; stroke-width:2.4;
            stroke-dasharray:6 5; stroke-linecap:round; }
        #highlights { position:absolute; inset:0; pointer-events:none; z-index:4; }
        .highlight { position:absolute; opacity:0.55; pointer-events:auto; }

        #edit-slots { position:absolute; inset:0; pointer-events:none; z-index:8; }
        .ach-preview img { object-fit:contain; }

        /* 手柄（放在 stage 全屏层，任何组件的 % 坐标都会换算到 stage） */
        #handles { position:absolute; inset:0; z-index:99; pointer-events:none; overflow:visible; }
        .h { position:absolute; width:22px; height:22px; margin-left:-11px; margin-top:-11px;
            border-radius:50%; border:2px solid #fff; cursor:grab; touch-action:none; pointer-events:auto;
            display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;
            box-shadow:0 0 0 1px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.5); }
        .h:active { cursor:grabbing; }
        .h.start { background:#3fbf6a; }
        .h.end   { background:#e0596b; }
        .h.ctr   { background:#3a86c8; border-radius:4px; }
        .h.rx    { background:#c98a3a; border-radius:4px; }
        .h.ry    { background:#8a3ac9; border-radius:4px; }
        .h.hlm   { background:#e6c886; border-radius:4px; width:18px; height:18px; margin-left:-9px; margin-top:-9px; }
        .h.hrs   { background:#9aa0a6; border-radius:2px; width:16px; height:16px; margin-left:-8px; margin-top:-8px; cursor:nwse-resize; }
        .h.comp-m { background:#3a86c8; border-radius:5px; width:20px; height:20px; margin-left:-10px; margin-top:-10px; font-size:11px; }
        .h.comp-r { background:#c98a3a; border-radius:3px; width:16px; height:16px; margin-left:-8px; margin-top:-8px; cursor:nwse-resize; }
        .h.slot-box { background:#5a6e8f; width:16px; height:16px; margin-left:-8px; margin-top:-8px; border-radius:2px; }
        .h.slot-r   { background:#7a9076; width:16px; height:16px; margin-left:-8px; margin-top:-8px; border-radius:2px; }
        .h.layer-m  { background:#c9a45c; width:18px; height:18px; margin-left:-9px; margin-top:-9px; border-radius:4px; }
        .h.layer-r  { background:#8d8d8d; width:16px; height:16px; margin-left:-8px; margin-top:-8px; border-radius:2px; cursor:nwse-resize; }
        .h.text-m   { background:#b76ed0; width:18px; height:18px; margin-left:-9px; margin-top:-9px; border-radius:50%; }
        .h.text-r   { background:#7f558c; width:16px; height:16px; margin-left:-8px; margin-top:-8px; border-radius:2px; cursor:ns-resize; }
        .h.q        { background:#c43fbf; border-radius:4px; width:20px; height:20px; margin-left:-10px; margin-top:-10px; font-size:12px; }

        /* 控制面板：可隐藏、可拖动 */
        #ctrl { position:absolute; top:10px; right:10px; width:330px; max-height:96vh; overflow:auto;
            background:rgba(26,22,17,0.96); border:1px solid rgba(201,164,92,0.5); border-radius:6px;
            padding:12px 14px; font-size:0.78rem; z-index:30;
            transition:transform 0.18s ease, opacity 0.18s ease; }
        #ctrl.hidden { transform:translateX(calc(100% + 24px)); opacity:0; pointer-events:none; }
        #show-panel { position:absolute; top:10px; right:10px; z-index:31; display:none;
            padding:8px 14px; background:rgba(26,22,17,0.96); border:1px solid #c9a45c; color:#e6c886;
            border-radius:6px; cursor:pointer; font-family:inherit; font-size:0.78rem; letter-spacing:0.1em; }
        #show-panel.show { display:block; }
        #ctrl-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        #drag-handle { flex:1; cursor:move; padding:2px 4px; color:rgba(242,234,217,0.55);
            font-size:0.7rem; letter-spacing:0.08em; border:1px dashed rgba(201,164,92,0.35); border-radius:2px; }
        #hide-panel { padding:4px 10px; border:1px solid #c9a45c; background:transparent; color:#e6c886;
            cursor:pointer; font-family:inherit; font-size:0.72rem; letter-spacing:0.1em; border-radius:2px; }
        #ctrl h2 { font-size:0.86rem; letter-spacing:0.14em; margin:0; color:#e6c886; }
        #ctrl .row { display:flex; align-items:center; gap:8px; margin:6px 0; flex-wrap:wrap; }
        #ctrl label { color:rgba(242,234,217,0.75); min-width:58px; }
        #ctrl input[type=range] { flex:1; min-width:70px; }
        #ctrl select, #ctrl input[type=number] { background:#13110d; border:1px solid rgba(201,164,92,0.5);
            color:#f2ead9; padding:3px 6px; font-family:inherit; font-size:0.78rem; border-radius:2px; }
        #ctrl button { padding:5px 10px; border:1px solid #c9a45c; background:transparent; color:#e6c886;
            cursor:pointer; font-family:inherit; font-size:0.74rem; letter-spacing:0.1em; border-radius:2px; }
        #ctrl button.active { background:rgba(201,164,92,0.2); color:#fff; }
        #ctrl textarea { width:100%; height:260px; margin-top:6px; background:#0f0d0a; color:#d8e6c8;
            border:1px solid rgba(201,164,92,0.3); border-radius:2px; font-family:Consolas,Menlo,monospace;
            font-size:0.7rem; padding:6px; resize:vertical; }
        .seg { display:inline-flex; border:1px solid rgba(201,164,92,0.5); border-radius:2px; overflow:hidden; }
        .seg button { border:none; border-radius:0; padding:5px 9px; }
        .note { color:rgba(242,234,217,0.6); font-size:0.72rem; line-height:1.6; margin-top:8px; }
        .b1{color:#3fbf6a} .b2{color:#e0596b} .b3{color:#3a86c8} .b4{color:#c43fbf}
        .b5{color:#c9a45c} .b6{color:#b76ed0}
        code { background:rgba(201,164,92,0.12); padding:1px 4px; border-radius:2px; color:#e6c886; }
    </style>
</head>
<body>
    <div id="stage">
        <img id="table-bg" class="comp bg" src="/绑扎/image/操作台背景.webp" alt="">
        <img id="prompt-move" class="comp prompt-move" src="/绑扎/image/提示——移至操作台.webp" alt="">
        <img id="prompt-start" class="comp" src="/绑扎/image/提示——开始绑扎定型.webp" alt="">
        <img id="flower" class="comp" src="/绑扎/image/四瓣花.webp" alt="">
        <img id="bottom-jing" class="comp" src="/绑扎/image/井底图.webp" alt="">
        <img id="bottom-shi" class="comp" src="/绑扎/image/十底图.webp" alt="">
        <img id="bottom-rao" class="comp" src="/绑扎/image/绕底图.webp" alt="">
        <img id="slide-icon" class="comp" src="/绑扎/image/提示——滑动icon.webp" alt="">

        <div id="play-stage">
            <div id="play">
                <div id="cup-box">
                    <img id="cup" class="fill" src="/绑扎/image/瓷杯底图.webp" alt="">
                    <div id="endpoints"></div>
                    <svg id="cup-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
                    <div id="highlights"></div>
                </div>
                <div id="panel-box">
                    <div id="edit-slots"></div>
                </div>
            </div>
        </div>
        <div id="handles"></div>
    </div>

    <button id="show-panel">显示面板</button>
    <div id="ctrl">
        <div id="ctrl-top">
            <span id="drag-handle">≡ 拖动面板</span>
            <button id="hide-panel">隐藏面板</button>
        </div>
        <h2>绑扎定型 · 编辑器</h2>
        <div class="row"><label>高度比</label><input id="r-h" type="range" min="0.5" max="0.95" step="0.01" value="0.80"><span id="v-h">0.80</span></div>
        <div class="row"><label>编辑</label>
            <div class="seg" id="seg-mode">
                <button data-mode="components" class="active">组件位置</button>
                <button data-mode="paths">路径起终点</button>
                <button data-mode="highlights">高亮位置</button>
                <button data-mode="slots">成就位置</button>
            </div>
        </div>
        <div class="row" id="comp-row">
            <label>起点宽</label><input id="r-start" type="range" min="4" max="18" step="0.1" value="8.5"><span id="v-start">8.5%</span>
            <label>终点宽</label><input id="r-end" type="range" min="4" max="22" step="0.1" value="11"><span id="v-end">11%</span>
        </div>
        <div class="row" id="hl4-row"><label>高亮4居中</label>
            <div class="seg" id="seg-cx4">
                <button data-val="1" class="active">居中</button>
                <button data-val="0">自由</button>
            </div>
        </div>
        <div class="row" id="slot-row" style="display:none"><label>编辑槽位</label>
            <div class="seg" id="seg-slot">
                <button data-slot="0" class="active">①井字</button>
                <button data-slot="1">②十字</button>
                <button data-slot="2">③绕底</button>
            </div>
        </div>
        <div class="row">
            <button id="t-comp">隐藏组件</button>
            <button id="t-path">隐藏路径</button>
            <button id="t-hl">隐藏高亮</button>
            <button id="t-grid">参考网格</button>
        </div>
        <div class="row"><button id="copy">复制 CONFIG 片段</button></div>
        <textarea id="out" readonly></textarea>
        <div class="note">
            <b>组件模式</b>：<span class="b3">■ M1..M10</span> 移动，<span class="b2">■ R1..R10</span> 缩放。
            顺序：背景、移至操作台、开始提示、四瓣花、井/十/绕底图、滑动icon、瓷杯、面板；起终点大小用上方滑块。<br>
            <b>路径模式</b>：<span class="b1">●</span>起点 <span class="b2">●</span>终点 <span class="b4">●</span>曲线控制点 / 椭圆心与半径。<br>
            <b>成就模式</b>：<span class="b5">■</span>槽位与图层，<span class="b6">●</span>文字1/文字2（T1.1/H1.1、T1.2/H1.2）。<br>
            改完点 <b>复制</b>，把内容贴回 <code>bind.js</code> 顶部 CONFIG 的对应字段。
        </div>
    </div>

    <script src="bind-edit.js"></script>
</body>
</html>
