<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#12100c">
    <link rel="icon" href="data:,">
    <title>锔瓷记</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fx.css">
</head>
<body>
    <!-- 动效层先完整结束，再进入下方故事视频与流程条时间轴 -->
    <div class="fx-root">
        <img id="page-bg" src="/image/视频/书页.webp" alt="">

        <div id="fx-scene">
            <div id="fx-frame">
                <div class="video-container">
                    <video id="main-video" muted playsinline preload="auto">
                        <source src="main-video.mp4" type="video/mp4">
                        您的浏览器不支持视频播放
                    </video>
                    <video id="proxy-video" muted playsinline preload="auto" onerror="if (!this.dataset.fallback) { this.dataset.fallback = '1'; this.src = 'main-video.mp4'; this.load(); }">
                        <source src="main-video-proxy.mp4" type="video/mp4" onerror="if (!this.parentNode.dataset.fallback) { this.parentNode.dataset.fallback = '1'; this.parentNode.src = 'main-video.mp4'; this.parentNode.load(); }">
                    </video>
                </div>

                <img id="fx-mask" src="/image/视频/遮罩.webp" alt="">
                <img id="fx-boy" src="/image/视频/瓷片小男孩.webp" alt="">
                <img id="fx-vertical-bar" src="/image/视频/竖条.webp" alt="">
                <img id="fx-logo" src="/image/视频/logo.webp" alt="">
                <img id="fx-token" src="/image/视频/令牌.webp" alt="">
                <img id="fx-text-1" src="/image/视频/文字1.png" alt="" data-steps="18">
                <img id="fx-text-2" src="/image/视频/文字2.png" alt="" data-steps="22">
                <img id="fx-text-3" src="/image/视频/文字3.png" alt="" data-steps="11">
                <img id="fx-text-4" src="/image/视频/文字4.png" alt="" data-steps="4">
                <!-- 节点动效：底条 + 游戏标题 + 棕色卡片（二维码 + 继续），视频上层、边框下层 -->
                <div id="node-fx">
                    <img id="node-fx-bar" class="nf-layer" src="/image/底条.webp" alt="">
                    <img id="node-fx-title" class="nf-layer" alt="">
                    <div id="node-fx-card" class="nf-layer">
                        <p id="node-fx-step" class="node-fx-step"></p>
                        <div id="node-fx-qr-wrap">
                            <canvas id="node-fx-qr" width="560" height="560"></canvas>
                        </div>
                        <p id="node-fx-qr-tip" class="node-fx-qr-tip">扫码进入小游戏</p>
                        <button id="node-fx-continue" class="continue-btn" type="button">继续</button>
                    </div>
                </div>
                <img id="fx-frame-img" src="/image/边框.webp" alt="">
            </div>

            <div id="page-stage" class="page-stage" aria-hidden="true">
                <video id="page-left" muted playsinline preload="auto" src="/image/两页/左边.mp4"></video>
                <video id="page-right" muted playsinline preload="auto" src="/image/两页/右边.mp4"></video>
                <video id="page-bar-left" muted playsinline preload="auto" src="/image/两页/竖条动画-左.webm?v=3"></video>
                <video id="page-bar-right" muted playsinline preload="auto" src="/image/两页/竖条动画-右.webm?v=3"></video>
                <img id="page-mask-left" class="page-mask" src="/image/两页/遮罩层.webp" alt="">
                <img id="page-mask-right" class="page-mask" src="/image/两页/遮罩层.webp" alt="">
                <img id="page-border-left" class="page-border" src="/image/两页/border-left-active.webp" alt="">
                <img id="page-border-right" class="page-border" src="/image/两页/border-right-active.webp" alt="">
                <img id="page-side-left" class="page-side" src="/image/两页/侧边条-左.png" alt="">
                <img id="page-side-right" class="page-side" src="/image/两页/侧边条-右.png" alt="">
            </div>

            <div id="fx-caption-zone">
                <img id="fx-monologue-1" src="/image/视频/独白1.webp" alt="">
                <img id="fx-monologue-2" src="/image/视频/独白2.webp" alt="">
                <div id="fx-process" class="process-bar" aria-hidden="true">
                    <div id="process-reveal">
                        <img class="process-layer process-base" src="/image/流程条/浅色工艺流程条.webp" alt="">
                        <div class="process-glow process-logo process-logo-icon pl-0">
                            <img src="/image/流程条/锔瓷缘起.webp" alt="">
                        </div>
                        <div class="process-glow process-logo process-logo-icon pl-1">
                            <img src="/image/流程条/名瓷鉴定.webp" alt="">
                        </div>
                        <div class="process-glow process-logo process-logo-icon pl-2">
                            <img src="/image/流程条/瓷片清洗.webp" alt="">
                        </div>
                        <div class="process-glow process-logo process-logo-icon pl-3">
                            <img src="/image/流程条/找碴对缝.webp" alt="">
                        </div>
                        <div class="process-glow process-logo process-logo-icon pl-4">
                            <img src="/image/流程条/绑扎定型.webp" alt="">
                        </div>
                        <div class="process-glow process-logo process-logo-icon pl-5">
                            <img src="/image/流程条/打孔上钉.webp" alt="">
                        </div>
                        <div class="process-glow process-line" style="clip-path: inset(39% 78.9% 51% 13.3%)">
                            <img src="/image/流程条/浅色工艺流程条.webp" alt="">
                        </div>
                        <div class="process-glow process-line" style="clip-path: inset(39% 62.2% 51% 30.1%)">
                            <img src="/image/流程条/浅色工艺流程条.webp" alt="">
                        </div>
                        <div class="process-glow process-line" style="clip-path: inset(39% 46.1% 51% 46.8%)">
                            <img src="/image/流程条/浅色工艺流程条.webp" alt="">
                        </div>
                        <div class="process-glow process-line" style="clip-path: inset(39% 27.75% 51% 62.95%)">
                            <img src="/image/流程条/浅色工艺流程条.webp" alt="">
                        </div>
                        <div class="process-glow process-line" style="clip-path: inset(39% 13% 51% 81.28%)">
                            <img src="/image/流程条/浅色工艺流程条.webp" alt="">
                        </div>
                    </div>
                </div>
            </div>
            <img id="fx-frame-logo" src="/image/logo.webp" alt="">
        </div>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p class="loading-text">正在装载瓷片</p>
    </div>

    <audio id="story-bgm" src="/audio/游戏初始界面/1.小游戏初始界面的背景音乐循环播放.mp3" loop preload="auto"></audio>

    <div id="scroll-hint" class="scroll-hint">
        <span class="hint-line"></span>
        <p>滚动探索</p>
    </div>

    <div id="end-overlay" class="end-overlay hidden">
        <div class="node-card end-card">
            <p class="node-step">故事收束</p>
            <h2 class="node-title">碎裂之处，皆有重光</h2>
            <p class="node-desc">四道工序走完，锔瓷的故事在此告一段落。</p>
            <button class="continue-btn" id="replay-btn" type="button">重新开始</button>
        </div>
    </div>

    <script src="vendor/qrcode-bundle.js"></script>
    <script src="script.js"></script>
    <script src="fx-layout.js"></script>
    <script src="page-layout.js"></script>
    <script src="fx.js"></script>
</body>
</html>
